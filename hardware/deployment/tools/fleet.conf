# Lab-specific settings of the robot fleet, read by the scripts in this folder (through fleet.sh / fleet.py).
# Replace the placeholders with your own values, or keep your values in a file outside the repository and
# point the FLEET_CONF environment variable at it.
PI_USER=pi                       # login user on every robot's Raspberry Pi
PI_KEY=$HOME/.ssh/id_ed25519     # ssh key that logs in as PI_USER without a password (the tools use BatchMode)
ROBOT_1=192.0.2.1                # IP address of robot-1's Pi
ROBOT_2=192.0.2.2
ROBOT_3=192.0.2.3
ROBOT_4=192.0.2.4
ROBOT_5=192.0.2.5
ROBOT_6=192.0.2.6
ROBOT_7=192.0.2.7
